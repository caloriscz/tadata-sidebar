<!DOCTYPE html>
<html>
<head>
  <title>TadataSideBar</title>
  <script src="sidebar.js" defer></script>
</head>
<body>
  <!-- Login Form -->
  <div id="login-form">
    <label>Email: <input type="email" id="email" /></label><br />
    <label>Password: <input type="password" id="password" /></label><br />
    <button id="login-button">Login</button>
  </div>

  <!-- User Info -->
  <div id="user-info" style="display: none;">
    <p id="welcome-message"></p>
    <textarea id="snippet-content" placeholder="Enter your snippet here"></textarea><br />
    <button id="save-snippet-button">Save Snippet</button><br />
    <p id="snippet-link" style="display: none;"></p>
    <button id="logout-button">Logout</button>
  </div>
</body>
</html>
